name: Build Linux release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version of the release (used in the file names)"
        required: false
        default: ""

jobs:
  build:
    name: Build (Linux x64)
    runs-on: ubuntu-22.04
    permissions:
      contents: write # the release of a tag is published with the files of the build
    env:
      VCPKG_ROOT: ${{ github.workspace }}/dependencies/vcpkg
      BUILD_TYPE: Release

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Determine the version
        run: |
          # a tag build takes the version from the tag (v1.3.3-linux -> 1.3.3-linux), so the file names of the
          # release always match the tag that published it
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.3.3"
          fi
          echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "version: $VERSION"

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxfixes-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev libcairo2-dev libglm-dev libpng-dev \
            libwayland-dev wayland-protocols \
            libcurl4-openssl-dev libssl-dev libusb-1.0-0-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libfontconfig1-dev \
            libbluetooth-dev \
            libvulkan-dev \
            unzip zip

      - name: Restore the vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ${{ env.VCPKG_ROOT }}/installed
            ${{ env.VCPKG_ROOT }}/buildtrees
            ${{ env.VCPKG_ROOT }}/packages
            build/release/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'dependencies/vcpkg_overlay_ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_ROOT/vcpkg" version

      - name: Configure
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_DISCORD_RPC=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build/release -- -k 0

      - name: Check the Clarity effect (ReShade) compiles
        # The Clarity preset shader is written as a ReShade effect (.fx). The ReShade effect compiler is built
        # here and the effect is turned into the GLSL the Vulkan renderer uses. The result is committed, so an
        # ordinary build does not need this step; it runs to catch a broken effect before it is committed.
        run: |
          python3 -m pip install --quiet glad jinja2
          bash tools/build_clarity_shader.sh
          git diff --exit-code -- src/pcedition/reshade/Clarity.fx.glsl \
            || echo "::warning::Clarity.fx.glsl is out of date, run tools/build_clarity_shader.sh"

      - name: Check the Clarity shader compiles as the renderer builds it
        # A broken shader only shows at run time, as a black screen after the loading screen (the game
        # draws nothing when the output shader fails), so it is compiled here the same way.
        run: |
          sudo apt-get install -y --no-install-recommends glslang-tools
          python3 tools/check_clarity_shader.py

      - name: Build the AMD FidelityFX runtime
        # The FSR 3 frame generation and the upscaler are in the runtime of AMD (the loader looks for it next to the
        # executable). The SDK has no build for Linux, so it is built here from the sources in the repository - the
        # patch adapts the build system of the SDK to Linux (see tools/ffx-linux-build.patch).
        continue-on-error: true # the FSR features stay off when this does not work
        run: |
          cd dependencies/FidelityFX-SDK
          git apply ../../tools/ffx-linux-build.patch || true
          cd ../..
          cmake -S dependencies/FidelityFX-SDK/ffx-api -B build/ffx -G Ninja \
            -DFFX_API_BACKEND=VK_X64 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ffx

      - name: Package
        run: |
          chmod +x tools/*.sh
          tools/package-linux.sh -Version "$PACKAGE_VERSION"

      - name: Upload the release
        uses: actions/upload-artifact@v4
        with:
          name: zelda-on-pc-linux-${{ env.PACKAGE_VERSION }}-x64
          path: |
            build/zelda-on-pc-linux-*-linux-x64.tar.gz
            build/zelda-on-pc-linux-*-linux-x64.tar.gz.sha256
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/zelda-on-pc-linux-*-linux-x64.tar.gz
            build/zelda-on-pc-linux-*-linux-x64.tar.gz.sha256
          generate_release_notes: true

      - name: Save the vcpkg cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ${{ env.VCPKG_ROOT }}/installed
            ${{ env.VCPKG_ROOT }}/buildtrees
            ${{ env.VCPKG_ROOT }}/packages
            build/release/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'dependencies/vcpkg_overlay_ports/**') }}
