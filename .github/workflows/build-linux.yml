name: Build Linux release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version of the release (used in the file names)"
        required: false
        default: "1.3.1"

jobs:
  build:
    name: Build (Linux x64)
    runs-on: ubuntu-22.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/dependencies/vcpkg
      BUILD_TYPE: Release
      PACKAGE_VERSION: ${{ github.event.inputs.version || '1.3.1' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxfixes-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libgtk-3-dev libcairo2-dev libglm-dev libpng-dev \
            libwayland-dev wayland-protocols \
            libcurl4-openssl-dev libssl-dev libusb-1.0-0-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libfontconfig1-dev \
            libbluetooth-dev \
            unzip zip

      - name: Set up the vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ${{ env.VCPKG_ROOT }}/installed
            ${{ env.VCPKG_ROOT }}/buildtrees
            ${{ env.VCPKG_ROOT }}/packages
            build/release/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'dependencies/vcpkg_overlay_ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_ROOT/vcpkg" version

      - name: Configure
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_DISCORD_RPC=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build/release -- -k 0

      - name: Package
        run: |
          chmod +x tools/*.sh
          tools/package-linux.sh -Version "$PACKAGE_VERSION"

      - name: Upload the release
        uses: actions/upload-artifact@v4
        with:
          name: zelda-on-pc-linux-${{ env.PACKAGE_VERSION }}-x64
          path: |
            build/zelda-on-pc-linux-*-linux-x64.tar.gz
            build/zelda-on-pc-linux-*-linux-x64.tar.gz.sha256
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/zelda-on-pc-linux-*-linux-x64.tar.gz
            build/zelda-on-pc-linux-*-linux-x64.tar.gz.sha256
          generate_release_notes: true
